[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Listing Lens team" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
native-tls = true
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
